<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3d4b"><title>Tideglass · Wallpaper atelier</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/globals.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><header class="mast"><a class="brand" href="/" aria-label="Tideglass home"><img src="/logo.png" alt="">Tideglass</a><a class="install" href="/install">Get Android <span aria-hidden="true">↗</span></a></header>
<main><h1>Wave atelier</h1><div class="atelier"><figure><canvas id="waves" width="1080" height="1920" aria-label="Generated wave wallpaper"></canvas><figcaption id="caption"></figcaption></figure><section class="settings"><h2>Shape the tide</h2><label>Color study<select id="palette"><option>Sea glass</option><option>Dusk coral</option><option>Deep indigo</option></select></label><div id="swatches" aria-hidden="true"></div><label>Wave height <output id="heightValue"></output><input type="range" min="5" max="45" value="23" id="height"></label><label>Layers <output id="layerValue"></output><input type="range" min="4" max="20" value="12" id="layers"></label><div class="row"><button class="ghost" id="shift">New variation</button><button class="action" id="export">Export PNG</button></div><p class="detail">1080 × 1920 pixels</p></section></div>
</main><footer><span>Tideglass</span><div><a href="https://github.com/hamzabounibanedz/wave-lines-android">Source</a><a href="https://github.com/hamzabounibanedz/wave-lines-android/releases/latest">Android releases</a><a href="/FONT-LICENSE.txt">Font license</a></div></footer><p id="message" role="status" aria-live="polite"></p><script type="module" src="/workspace.js"></script></body></html>
